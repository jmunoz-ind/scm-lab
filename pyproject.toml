[project]
name = "scm-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "j-munoz-ind", email = "j.munoz.ind@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
]

[project.scripts]
scm-lab = "scm_lab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.3",
]
